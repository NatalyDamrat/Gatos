<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo dos Gatos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf6e3;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #d35400;
        }
        .mensagem {
            font-size: 18px;
            color: #333;
            background-color: #fff3e0;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 500px;
        }
        .botao {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .botao:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>
    <h1>🐱 Mundo dos Gatos</h1>
    <p class="mensagem">Clique no botão para descobrir uma curiosidade sobre gatos!</p>
    <button class="botao">Mostrar curiosidade</button>

    <script>
        // Seleciona os elementos da página
        const botao = document.querySelector(".botao");
        const mensagem = document.querySelector(".mensagem");

        // Cria um array com curiosidades sobre gatos
        const curiosidades = [
            "Os gatos passam cerca de 70% da vida dormindo. 😴",
            "O nariz de cada gato é único, como uma impressão digital. 👃",
            "Gatos não conseguem sentir o sabor doce. 🍬",
            "Um gato pode saltar até 6 vezes a sua própria altura. 🦘",
            "O ronronar dos gatos pode ajudar a curar ossos e tecidos. 💚",
            "Gatos têm 32 músculos em cada orelha. 👂",
            "A expectativa de vida de um gato pode chegar a 20 anos. 🎂"
        ];

        // Função que será executada ao clicar no botão
        function mostrarCuriosidade() {
            // Sorteia uma curiosidade aleatória do array
            const indice = Math.floor(Math.random() * curiosidades.length);
            // Altera o texto da mensagem na página
            mensagem.textContent = curiosidades[indice];
        }

        // Adiciona o evento de clique ao botão
        botao.addEventListener("click", mostrarCuriosidade);
    </script>
</body>
</html>
